<!doctype html>
<html lang="en" class="light bg-[#EBF0F5] dark:bg-[#0B0F19] overflow-x-hidden w-full max-w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EBF0F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F19" />
    <title>PrivacyKit — Simple tools to protect your digital privacy</title>
    <meta name="description" content="Scan, clean, and understand what your files and links reveal about you. 100% browser-first local processing." />
    <meta property="og:title" content="PrivacyKit — Privacy-First File & Link Toolkit" />
    <meta property="og:description" content="Remove EXIF, GPS, PDF metadata, and URL trackers directly in your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('privacykit_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#EBF0F5] dark:bg-[#0B0F19] text-[#0F172A] dark:text-[#E2E8F0] font-sans antialiased selection:bg-indigo-500/20 dark:selection:bg-indigo-500/35 selection:text-indigo-900 dark:selection:text-indigo-200 min-h-screen w-full max-w-full overflow-x-hidden transition-colors duration-200 m-0 p-0">
    <div id="root" class="w-full max-w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
